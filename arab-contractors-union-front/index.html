<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Cairo + Tajawal Arabic Fonts -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap">
    </noscript>

    <title>اتحاد المقاولين الفلسطينيين</title>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="اتحاد المقاولين الفلسطينيين — لوحة التحكم" />
    <meta property="og:description" content="لوحة تحكم إدارة اتحاد المقاولين الفلسطينيين" />
    <meta property="og:site_name"   content="Palestinian Contractors Union" />
    <meta property="og:locale"      content="ar_PS" />

    <!-- SEO -->
    <meta name="description" content="لوحة تحكم إدارة اتحاد المقاولين الفلسطينيين" />
    <meta name="robots"      content="noindex, nofollow" />

    <!-- Loader Styles -->
    <style>
      body { margin: 0; font-family: 'Cairo', sans-serif; }
      html { overflow-x: hidden; overflow-y: scroll; }
      #loading-bg {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F4F6F9;
        width: 100vw;
        height: 100vh;
        gap: 1.5rem 0;
      }
      .loading-logo {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading {
        position: relative;
        box-sizing: border-box;
        border: 3px solid transparent;
        border-radius: 50%;
        block-size: 55px;
        inline-size: 55px;
      }
      .loading .effect-1,
      .loading .effect-2,
      .loading .effect-3 {
        position: absolute;
        box-sizing: border-box;
        border: 3px solid transparent;
        border-radius: 50%;
        block-size: 100%;
        border-inline-start: 3px solid #000269;
        inline-size: 100%;
      }
      .loading .effect-1 { animation: rotate 1s ease infinite; }
      .loading .effect-2 { animation: rotate-opacity 1s ease infinite 0.1s; }
      .loading .effect-3 { animation: rotate-opacity 1s ease infinite 0.2s; }
      @keyframes rotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(1turn); }
      }
      @keyframes rotate-opacity {
        0%   { opacity: 0.1; transform: rotate(0deg); }
        100% { opacity: 1;   transform: rotate(1turn); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading-bg">
        <div class="loading-logo">
          <img src="/logo.png" alt="اتحاد المقاولين الفلسطينيين" style="width:160px;height:160px;object-fit:contain;" />
        </div>
        <div class="loading">
          <div class="effect-1 effects"></div>
          <div class="effect-2 effects"></div>
          <div class="effect-3 effects"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/resources/ts/main.ts"></script>
  </body>
</html>
