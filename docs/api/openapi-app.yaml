        "404": { $ref: "#/components/responses/NotFound" }

# =====================================================================
# COMPONENTS
# =====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: "Token from login / set-password / forgot-password reset / change-password. Header: `Authorization: Bearer <token>`."

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, default: 15 }
    PerPage100:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    PaymentId:
      name: payment
      in: path
      required: true
      schema: { type: integer }
    TicketId:
      name: ticket
      in: path
      required: true
      schema: { type: integer }
    TenderId:
      name: tender
      in: path
      required: true
      schema: { type: integer }
    AnnouncementId:
      name: announcement
      in: path
      required: true
      schema: { type: integer }
    EventId:
      name: event
      in: path
      required: true
      schema: { type: integer }
    EquipmentId:
      name: equipment
      in: path
      required: true
      schema: { type: integer }
    EquipmentImageId:
      name: equipmentImage
      in: path
      required: true
      schema: { type: integer }
    TenderSearch:
      name: search
      in: query
      description: Matches tender title.
      schema: { type: string }
    TenderStatus:
      name: status
      in: query
      schema: { type: string, enum: [open, closed, cancelled] }
    TenderCategory:
      name: category
      in: query
      description: Category name (see `/tender-categories-public`).
      schema: { type: string }
    TenderScope:
      name: scope
      in: query
      description: |
        `active` = not archived, `archived` = archived, `my_specialties` = tenders whose category matches
        the contractor's fields (authenticated endpoints only).
      schema: { type: string, enum: [active, archived, my_specialties] }
    TenderStates:
      name: states[]
      in: query
      description: |
        Any of: `new` (created in last 48h), `updated` (updated in last 48h), `closing_soon`
        (deadline within the next 4 days). Multiple values are OR-ed.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, enum: [new, updated, closing_soon] }
    TenderBookmarkedOnly:
      name: bookmarked
      in: query
      description: "`1` = only my bookmarked tenders (authenticated only)."
      schema: { type: integer, enum: [0, 1] }
    TenderSort:
      name: sort
      in: query
      description: Default is newest first.
      schema:
        type: string
        enum: [oldest, deadline_asc, deadline_desc, updated_asc, updated_desc, budget_asc, budget_desc]

  responses:
    OkNoItems:
      description: Success with a message only.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { status: true, message: "تمت العملية بنجاح", status_code: 200 }
    CreatedNoItems:
      description: Created, message only.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { status: true, message: "تم إرسال بلاغك، وسيتم مراجعته من قِبل الإدارة.", status_code: 201 }
    UnreadCount:
      description: Unread count.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  items:
                    type: object
                    properties:
                      unread_count: { type: integer, example: 3 }
    AnnouncementOne:
      description: Announcement.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  items: { $ref: "#/components/schemas/Announcement" }
    Unauthenticated:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, message: "غير مصرح بالوصول. يرجى تسجيل الدخول", status_code: 401 }
    ForceLogout:
      description: Account frozen from the dashboard. All tokens were revoked; clear the session and go to login.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            status: false
            message: "تم تجميد حسابك. تواصل مع الاتحاد للمزيد من المعلومات"
            status_code: 403
            error: account_frozen
            force_logout: true
    NotFound:
      description: Route or record not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, message: "العنصر المطلوب غير موجود", status_code: 404 }
    ValidationError:
      description: Validation failed. `message` is the first error; `errors` has all of them per field.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            status: false
            message: "حقل كلمة المرور مطلوب."
            status_code: 422
            errors:
              password: ["حقل كلمة المرور مطلوب."]
    TooManyRequests:
      description: Rate limit exceeded (auth endpoints allow 5 requests per minute per IP).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, message: "عدد محاولات كبير. حاول مرة أخرى بعد قليل", status_code: 429 }
    OtpCooldown:
      description: |
        Either the auth rate limit (5/min/IP), or the OTP cooldown (`error: otp_cooldown`,
        `errors.expires_in` = seconds until a new OTP can be requested).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            status: false
            message: "يرجى الانتظار قبل طلب رمز جديد."
            status_code: 429
            error: otp_cooldown
            errors: { expires_in: 21 }

  schemas:
    # ---------- Envelope ----------
    Envelope:
      type: object
      required: [status, message, status_code]
      properties:
        status: { type: boolean, example: true }
        message: { type: string, example: "تمت العملية بنجاح" }
        status_code: { type: integer, example: 200 }
        items:
          description: Payload. Omitted when there is none.
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        last_page: { type: integer, example: 4 }
        per_page: { type: integer, example: 15 }
        total: { type: integer, example: 52 }
    PaginatedEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            items: { type: array, items: {} }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    Error:
      type: object
      required: [status, message, status_code]
      properties:
        status: { type: boolean, example: false }
        message: { type: string, description: Human-readable Arabic message. }
        status_code: { type: integer, example: 422 }
        error:
          type: string
          description: Machine-readable key, when set (e.g. `invalid_credentials`, `account_frozen`, `otp_cooldown`, `dues_pending`).
        errors:
          type: object
          additionalProperties: true
          description: Validation errors (field → messages) or extra context (e.g. `issues`, `expires_in`).
        force_logout:
          type: boolean
          description: Present (true) only on the frozen-account 403.

    # ---------- Small shared ----------
    ValueLabel:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
    IdName:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Governorate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        cities:
          type: array
          items: { $ref: "#/components/schemas/IdName" }
    Currency:
      type: string
      enum: [JOD, ILS, USD]
    OtpCooldownSeconds:
      type: integer
      example: 35
      description: |
        ⚠️ Despite the name, this is the **resend cooldown** in seconds (35), not the OTP validity.
        The SMS text says the code is valid for 10 minutes.
    OtpPreview:
      type: string
      description: The OTP itself, returned **only** when the server runs in OTP preview mode (no real SMS, e.g. staging). Absent in production.
      example: "482913"
    SupportContact:
      type: object
      properties:
        support_whatsapp: { type: string }
        support_email: { type: string }
        support_phone: { type: string }
    SocialLinks:
      type: object
      description: Only non-empty links are present.
      properties:
        facebook: { type: string, format: uri }
        instagram: { type: string, format: uri }
        twitter: { type: string, format: uri }
        linkedin: { type: string, format: uri }
        youtube: { type: string, format: uri }
        website: { type: string, format: uri }

    # ---------- Contractor ----------
    ContractorStatus:
      type: string
      enum: [active, pending, expired, suspended]
      description: "`suspended` blocks renewal only, not login. Login is blocked only by `is_frozen`."
    MembershipBadge:
      type: string
      description: "`active` / `expired` from the active membership; otherwise falls back to the contractor `status`."
      example: active
    ContractorAuthMini:
      type: object
      description: Minimal user object returned by set-password and forgot-password reset.
      properties:
        id: { type: integer }
        membership_number: { type: string, example: "184_g" }
        commercial_register: { type: string, nullable: true, description: Only in set-password. }
        name: { type: string }
        authorized_person: { type: string, nullable: true }
        phone: { type: string }
        classification: { type: string, nullable: true }
    ContractorLite:
      type: object
      description: Light profile returned on login.
      properties:
        id: { type: integer, example: 184 }
        membership_number: { type: string, example: "184_g" }
        commercial_register: { type: string, nullable: true }
        license_number: { type: string, nullable: true }
        name: { type: string, example: "شركة المثال للمقاولات" }
        logo_url: { type: string, format: uri, nullable: true }
        authorized_person: { type: string, nullable: true }
        authorized_person_id_number: { type: string, nullable: true }
        authorized_person_phone: { type: string, nullable: true }
        authorized_person_whatsapp: { type: string, nullable: true }
        classification_label: { type: string, nullable: true, example: "درجة أولى" }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        governorate:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        city:
          type: object
          nullable: true
          description: "`id` is absent for legacy text-only cities."
          properties:
            id: { type: integer }
            name: { type: string }
        status: { $ref: "#/components/schemas/ContractorStatus" }
        is_frozen: { type: boolean }
        profile_completed: { type: boolean, description: True once the app account was activated (password set). }
        last_login_at: { type: string, format: date-time, nullable: true }
        membership:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            type: { type: string, example: renewal }
            status: { type: string, example: active }
            expires_at: { type: string, format: date, nullable: true }
            is_expired: { type: boolean }
    ContractorFull:
      description: Full profile (lite fields + details + file URLs).
      allOf:
        - $ref: "#/components/schemas/ContractorLite"
        - type: object
          properties:
            account_status: { $ref: "#/components/schemas/AccountStatus" }
            established_date: { type: string, format: date, nullable: true }
            owner_name: { type: string, nullable: true }
            address: { type: string, nullable: true }
            notes: { type: string, nullable: true }
            profile_data_complete: { type: boolean, description: Required before requesting a membership certificate. }
            missing_profile_fields:
              type: array
              items: { type: string }
              description: Arabic labels of missing required fields.
            fields:
              type: array
              description: The contractor's fields → specializations → grade, resolved to names.
              items:
                type: object
                properties:
                  field_id: { oneOf: [{ type: integer }, { type: string }], nullable: true }
                  field_name: { type: string }
                  specializations:
                    type: array
                    items:
                      type: object
                      properties:
                        spec_id: { oneOf: [{ type: integer }, { type: string }], nullable: true }
                        spec_name: { type: string }
                        grade: { type: string, nullable: true }
                        grade_label: { type: string, nullable: true }
                        grade_level: { type: integer, nullable: true }
            partners:
              nullable: true
              description: Free-form partners data as stored by the dashboard (structure not enforced by the API).
            specialties:
              type: array
              nullable: true
              description: Raw specialties as stored.
              items:
                type: object
                properties:
                  field_lk_type: { oneOf: [{ type: integer }, { type: string }] }
                  specialization_lk_type: { oneOf: [{ type: integer }, { type: string }] }
                  classification: { type: string }
            fax: { type: string, nullable: true }
            district: { type: string, nullable: true }
            building: { type: string, nullable: true }
            floor: { type: string, nullable: true }
            capital: { type: string, nullable: true }
            registration_date: { type: string, nullable: true }
            legal_form: { type: string, nullable: true }
            company_purposes: { type: string, nullable: true }
            cr_file_url: { $ref: "#/components/schemas/NullableUrl" }
            id_file_url: { $ref: "#/components/schemas/NullableUrl" }
            lease_or_ownership_contract_url: { $ref: "#/components/schemas/NullableUrl" }
            company_approval_letter_url: { $ref: "#/components/schemas/NullableUrl" }
            municipal_license_url: { $ref: "#/components/schemas/NullableUrl" }
            company_register_url: { $ref: "#/components/schemas/NullableUrl" }
            articles_of_association_url: { $ref: "#/components/schemas/NullableUrl" }
            internal_bylaws_url: { $ref: "#/components/schemas/NullableUrl" }
            bank_dealing_letter_url: { $ref: "#/components/schemas/NullableUrl" }
            secretary_contract_url: { $ref: "#/components/schemas/NullableUrl" }
            full_time_engineer_certificate_url: { $ref: "#/components/schemas/NullableUrl" }
            accountant_certificate_or_contract_url: { $ref: "#/components/schemas/NullableUrl" }
            partners_ids_url: { $ref: "#/components/schemas/NullableUrl" }
            authorization_letter_url: { $ref: "#/components/schemas/NullableUrl" }
            authorized_signature_url: { $ref: "#/components/schemas/NullableUrl" }
    NullableUrl:
      type: string
      format: uri
      nullable: true
    ProfileUpload:
      type: string
      format: binary
      description: pdf, jpg, jpeg or png. Max 10 MB. Replaces the existing file.
    ProfileFileField:
      type: string
      enum:
        - cr_file
        - id_file
        - lease_or_ownership_contract
        - company_approval_letter
        - municipal_license
        - company_register
        - articles_of_association
        - internal_bylaws
        - bank_dealing_letter
        - secretary_contract
        - full_time_engineer_certificate
        - accountant_certificate_or_contract
        - partners_ids
        - authorization_letter
        - authorized_signature
    AccountStatus:
      type: object
      description: '"My account" card: one priority banner, dues, certificate lock, marketplace badge.'
      properties:
        banner:
          type: object
          nullable: true
          description: Priority membership_expired > dues_overdue > membership_active.
          properties:
            type: { type: string, enum: [membership_expired, dues_overdue, membership_active] }
            severity: { type: string, enum: [error, warning, success] }
            expires_at: { type: string, format: date, nullable: true }
            outstanding_amount: { type: number, description: Only for dues_overdue. }
            message: { type: string }
            cta: { type: string, nullable: true, enum: [renew_membership, pay_dues, null] }
            cta_label: { type: string, nullable: true }
        dues:
          type: object
          properties:
            has_pending: { type: boolean }
            outstanding_amount: { type: number }
            badge: { type: string, nullable: true }
        certificates:
          type: object
          properties:
            locked: { type: boolean }
            lock_reason: { type: string, nullable: true }
        equipment_subscription:
          type: object
          properties:
            active: { type: boolean }
            badge: { type: string }
            expires_at: { type: string, format: date, nullable: true }

    # ---------- Membership & finance ----------
    Membership:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [new, renewal, upgrade] }
        status: { type: string, example: active }
        starts_at: { type: string, format: date, nullable: true }
        expires_at: { type: string, format: date, nullable: true }
        amount: { type: string, nullable: true, example: "150.00", description: Decimal as string. }
        expiring_soon: { type: boolean }
    SubscriptionStatus:
      type: object
      properties:
        id: { type: integer, nullable: true, description: Active membership id. }
        type: { type: string, nullable: true }
        membership_status: { type: string, nullable: true }
        badge: { $ref: "#/components/schemas/MembershipBadge" }
        starts_at: { type: string, format: date, nullable: true }
        expires_at: { type: string, format: date, nullable: true }
        amount: { type: string, nullable: true }
        expiring_soon: { type: boolean }
        days_remaining: { type: integer, nullable: true }
        can_renew: { type: boolean }
        renewal_blockers:
          type: array
          items: { $ref: "#/components/schemas/RequirementIssue" }
        outstanding_total_jod: { type: number }
    RequirementIssue:
      type: object
      properties:
        type:
          type: string
          enum: [late_fees, unpaid_dues, pending_dispute, overdue_subscription, account_suspended]
        description: { type: string }
        amount: { type: number, nullable: true }
        due_date: { type: string, format: date, nullable: true }
    DueStatus:
      type: string
      enum: [unpaid, partially_paid, paid]
    Due:
      type: object
      properties:
        id: { type: integer }
        year: { type: integer, nullable: true }
        period: { type: string, nullable: true }
        reference_number: { type: string, nullable: true }
        description: { type: string }
        amount_jod: { type: number }
        paid_jod: { type: number }
        remaining_jod: { type: number }
        status: { $ref: "#/components/schemas/DueStatus" }
        status_label: { type: string }
        due_date: { type: string, format: date, nullable: true }
    StatementLine:
      type: object
      properties:
        date: { type: string, format: date, nullable: true }
        description: { type: string }
        type: { type: string, enum: [payment, penalty, due] }
        direction: { type: string, enum: [credit, debit], description: "credit = paid by the contractor; debit = owed." }
        amount: { type: string, example: "50.00" }
        status: { type: string }
        reference: { type: string, nullable: true }

    # ---------- Payments ----------
    PaymentStatus:
      type: string
      enum: [pending, paid, rejected]
    PaymentType:
      type: string
      description: "Known values: `membership_fee` (default), `dues_payment`, `penalty`. Legacy rows may contain `membership`. The server accepts any string up to 50 chars."
      example: dues_payment
    Payment:
      type: object
      properties:
        id: { type: integer }
        transaction_number: { type: string, nullable: true }
        contractor: { type: string, nullable: true, description: Contractor name. }
        contractor_id: { type: integer }
        membership_id: { type: integer, nullable: true }
        equipment_package_id: { type: integer, nullable: true }
        bank_account_id: { type: integer, nullable: true }
        amount: { type: number }
        currency: { $ref: "#/components/schemas/Currency" }
        exchange_rate: { type: number, nullable: true, description: Set by the accountant on confirmation. }
        amount_jod: { type: number, nullable: true }
        rate_source: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/PaymentType" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        status_label: { type: string }
        method: { type: string, example: bank_transfer }
        reference_number: { type: string, nullable: true }
        receipt_image_url: { type: string, format: uri, nullable: true }
        receipt_pdf_url: { type: string, format: uri, nullable: true }
        rejection_reason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- Documents ----------
    Document:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string, example: tender }
        url: { type: string, description: "Full URL on upload; raw storage path in the list endpoint (see note there)." }
        mime_type: { type: string, nullable: true }
        formatted_size: { type: string, nullable: true, example: "1.2 MB" }
        created_at: { type: string, format: date }

    # ---------- Certificates ----------
    CertificateType:
      type: string
      enum: [membership, good_standing, classification, experience]
    CertificateRequest:
      type: object
      properties:
        id: { type: integer }
        contractor_id: { type: integer }
        contractor: { type: string, nullable: true }
        membership_number: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/CertificateType" }
        type_label: { type: string }
        status: { type: string, enum: [pending, approved, issued, rejected] }
        status_label: { type: string }
        awaiting_payment_confirmation: { type: boolean }
        pending_payment:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            transaction_number: { type: string, nullable: true }
            amount: { type: number }
            currency: { $ref: "#/components/schemas/Currency" }
            status: { $ref: "#/components/schemas/PaymentStatus" }
            submitted_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        attachment_url: { type: string, format: uri, nullable: true }
        reject_reason: { type: string, nullable: true }
        certificate_url: { type: string, format: uri, nullable: true, description: Set once issued. }
        request_date: { type: string, format: date-time }
        issue_date: { type: string, format: date-time, nullable: true }
        reviewed_by: { type: string, nullable: true }

    # ---------- Support ----------
    TicketCategory:
      type: string
      enum: [technical, complaint, inquiry, suggestion, other]
    TicketStatus:
      type: string
      description: "Known values: `open`, `answered`, `closed` (the model may define more)."
      example: open
    TicketMessage:
      type: object
      properties:
        id: { type: integer }
        sender_type: { type: string, enum: [contractor, admin] }
        sender_name: { type: string, nullable: true }
        message: { type: string }
        attachment_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }
    SupportTicket:
      type: object
      properties:
        id: { type: integer }
        contractor_id: { type: integer }
        contractor: { type: string, nullable: true }
        subject: { type: string }
        whatsapp_phone: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        category_label: { type: string }
        message: { type: string }
        attachment_url: { type: string, format: uri, nullable: true }
        status: { $ref: "#/components/schemas/TicketStatus" }
        status_label: { type: string }
        reply: { type: string, nullable: true, description: Legacy single admin reply. }
        replied_by: { type: string, nullable: true }
        replied_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: "#/components/schemas/TicketMessage" }
    SupportTicketDetails:
      type: object
      properties:
        id: { type: integer }
        subject: { type: string }
        whatsapp_phone: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        category_label: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        status_label: { type: string }
        message: { type: string }
        attachment:
          type: object
          nullable: true
          properties:
            url: { type: string, format: uri }
            name: { type: string }
            extension: { type: string }
        reply:
          type: object
          nullable: true
          properties:
            text: { type: string }
            replied_by: { type: string, nullable: true }
            replied_at: { type: string, format: date-time, nullable: true }
        messages:
          type: array
          items: { $ref: "#/components/schemas/TicketMessage" }
        contractor:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            membership_number: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- Notifications ----------
    InboxNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: "Laravel notification class name, e.g. `App\\Notifications\\PaymentConfirmedNotification`." }
        data:
          type: object
          additionalProperties: true
          description: Payload; varies per notification type (typically title, body and reference ids).
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AppNotification:
      type: object
      properties:
        id: { type: integer }
        contractor_id: { type: integer }
        type: { type: string, enum: [announcement, payment_reminder, expiry_reminder] }
        title: { type: string }
        body: { type: string }
        reference_id: { type: integer, nullable: true, description: E.g. the announcement id for deep linking. }
        reference_type: { type: string, nullable: true }
        action_url: { type: string, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        run_id: { type: string, nullable: true, description: Internal batch id. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- Home feed ----------
    FeedItem:
      type: object
      properties:
        type:
          type: string
          enum: [tender, news, circular, finance, member]
          description: |
            Where `reference_id` points: `tender` → tender id, `news` → news id, `circular` → announcement id,
            `finance` → due id, `member` → membership id **or** certificate request id (both use type `member`).
        reference_id: { type: integer }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        badges:
          type: array
          items: { type: string }
          description: Arabic badges, any of "ملحق" (attachment), "جديد" (new), "مرفوض" (rejected).
        priority: { type: string, enum: [normal, high] }
        created_at: { type: string, format: date-time }

    # ---------- Tenders ----------
    Tender:
      type: object
      properties:
        id: { type: integer }
        reference_number: { type: string, nullable: true }
        title: { type: string }
        issuing_entity: { type: string, nullable: true }
        description: { type: string, nullable: true }
        union_notes: { type: string, nullable: true, description: Authenticated endpoints only; null on public endpoints. }
        category: { type: string, nullable: true }
        category_image: { type: string, format: uri, nullable: true }
        budget: { type: number, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, closed, cancelled] }
        display_status: { type: string, enum: [new, updated, closing_soon, closed] }
        display_status_label: { type: string }
        is_active: { type: boolean }
        is_new: { type: boolean }
        is_updated: { type: boolean }
        closing_soon: { type: boolean }
        archived_at: { type: string, format: date, nullable: true }
        submission_types:
          type: array
          nullable: true
          items: { type: string }
        submission_email: { type: string, nullable: true }
        submission_phone: { type: string, nullable: true }
        submission_file_url: { type: string, format: uri, nullable: true }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              label: { type: string, nullable: true }
              url: { type: string, format: uri }
              is_image: { type: boolean }
        external_url: { type: string, format: uri, nullable: true }
        is_bookmarked: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- Announcements ----------
    Announcement:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        number: { type: string, nullable: true, example: "2026/14" }
        category: { type: string, nullable: true }
        body: { type: string, description: HTML. }
        image: { type: string, format: uri, nullable: true, description: Full URL. }
        attachment: { type: string, format: uri, nullable: true, description: Full URL (pdf/doc/docx). }
        is_pinned: { type: boolean, description: Present in the list endpoint only. }
        published_at: { type: string, format: date-time }
        effective_status:
          type: string
          description: Computed status; present in list/pending responses (not in the details response).

    # ---------- Events ----------
    EventFormat:
      type: string
      enum: [onsite, online, hybrid]
    Speaker:
      type: object
      properties:
        name: { type: string, nullable: true }
        title: { type: string, nullable: true }
        photo: { type: string, nullable: true }
        is_keynote: { type: boolean }
    EventSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        image: { type: string, format: uri, nullable: true }
        video_url: { type: string, format: uri, nullable: true }
        external_url: { type: string, format: uri, nullable: true }
        gallery:
          type: array
          items: { type: string, format: uri }
        published_at: { type: string, format: date-time }
        event_date: { type: string, format: date-time, nullable: true }
        event_location: { type: string, nullable: true }
        is_archived: { type: boolean }
    ContractorEvent:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        body: { type: string, nullable: true, description: HTML. }
        image: { type: string, format: uri, nullable: true }
        gallery:
          type: array
          items: { type: string, format: uri }
        event_date: { type: string, format: date-time, nullable: true }
        is_archived: { type: boolean }
        event_location: { type: string, nullable: true, description: Always null for online events. }
        event_format: { $ref: "#/components/schemas/EventFormat" }
        is_international: { type: boolean }
        stream_url: { type: string, format: uri, nullable: true, description: Only on the event day. }
        stream_available: { type: boolean }
        speakers:
          type: array
          items: { $ref: "#/components/schemas/Speaker" }
        attendees_count: { type: integer }
        is_registered: { type: boolean }

    # ---------- News ----------
    NewsSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        image: { type: string, format: uri, nullable: true }
        video_url: { type: string, format: uri, nullable: true }
        external_url: { type: string, format: uri, nullable: true }
        gallery:
          type: array
          items: { type: string, format: uri }
        published_at: { type: string, format: date-time }

    # ---------- Equipment ----------
    EquipmentCondition:
      type: string
      enum: [excellent, good, needs_maintenance]
    ContractType:
      type: string
      enum: [daily, weekly, monthly]
    Equipment:
      type: object
      properties:
        id: { type: integer }
        contractor_id: { type: integer }
        contractor_name: { type: string, nullable: true }
        equipment_type_id: { type: integer }
        type:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name_ar: { type: string }
            icon: { type: string, nullable: true }
        name: { type: string }
        brand: { type: string, nullable: true }
        description: { type: string, nullable: true }
        manufacture_year: { type: integer, nullable: true }
        power: { type: string, nullable: true }
        condition: { allOf: [{ $ref: "#/components/schemas/EquipmentCondition" }], nullable: true }
        contract_type: { allOf: [{ $ref: "#/components/schemas/ContractType" }], nullable: true }
        governorate: { type: string, nullable: true }
        city: { type: string, nullable: true }
        owner_phone: { type: string, nullable: true }
        status: { type: string, enum: [visible, hidden, suspended] }
        is_featured: { type: boolean }
        needs_maintenance: { type: boolean }
        is_new: { type: boolean }
        is_hidden: { type: boolean }
        images:
          type: array
          description: |
            All images on details / my-equipment endpoints.
            ⚠️ In the marketplace list only `primaryImage` is eager-loaded, but the formatter reads
            `images`, so each list item may lazy-load all images (needs confirmation).
          items:
            type: object
            properties:
              id: { type: integer }
              url: { type: string, format: uri }
              is_primary: { type: boolean }
        created_at: { type: string, format: date-time }
    EquipmentPackage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: string, example: "25.00" }
        currency: { type: string, example: JOD }
        duration_days: { type: integer }
        ads_limit: { type: integer, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EquipmentReservation:
      type: object
      properties:
        id: { type: integer }
        equipment_id: { type: integer }
        contractor_id: { type: integer }
        start_date: { type: string, format: date-time, description: Serialized date (midnight). }
        end_date: { type: string, format: date-time }
        status: { type: string, enum: [confirmed, cancelled] }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        equipment:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            contractor_id: { type: integer, description: Only in the my-reservations list. }

    # ---------- Content ----------
    TermSection:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        title_en: { type: string, nullable: true }
        body: { type: string }
        body_en: { type: string, nullable: true }
        sort: { type: integer }
    LegalFile:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        title_en: { type: string, nullable: true }
        description: { type: string, nullable: true }
        description_en: { type: string, nullable: true }
        category: { type: string }
        category_label: { type: string }
        url: { type: string, format: uri }
        mime_type: { type: string, nullable: true }
        size: { type: integer, nullable: true }
        formatted_size: { type: string, nullable: true }
        sort: { type: integer }
        is_active: { type: boolean }
        is_featured: { type: boolean }
        created_at: { type: string, format: date-time }
